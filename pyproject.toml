[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "begf-icassp2027"
version = "0.1.0"
description = "Band-Energy Adaptive Graph Filtering for Ensemble Clustering"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
